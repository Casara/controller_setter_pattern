plugins:
  - rubocop-rspec
  - rubocop-factory_bot
  - rubocop-rspec_rails

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.4
  Exclude:
    - 'vendor/**/*'
    - 'tmp/**/*'
    - 'coverage/**/*'
    - 'log/**/*'
    - '.git/**/*'
    - '.github/**/*'
    - '.devcontainer/**/*'

# Metrics Cops
Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
Metrics/MethodLength:
  Max: 15

# Style Cops
Style/Documentation:
  Enabled: false
Style/FrozenStringLiteralComment:
  Enabled: false

# RSpec Cops
RSpec/NestedGroups:
  Max: 5
